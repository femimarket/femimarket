# cbindgen config for the C-ABI header of metadata-core's cfg(iOS) `capi` module.
#
# Moved here (verbatim) from the former metadata-ffi crate when the C-ABI shim was
# folded into metadata-core. The Gradle `cbindgenMetadataFfi` task runs this with
# TARGET=aarch64-apple-ios so the cfg gates resolve as iOS and ONLY the `md_*`
# C-ABI is emitted (the cfg(not(ios)) JNI `extern "system"` fns are cfg'd out and
# harmlessly skipped). `parse_deps = false` keeps id3/infer/jni out of the header.
#
# include_guard stays METADATA_FFI_H so the generated composeApp/.../metadata_ffi.h
# (referenced by metadata.def) is byte-identical to the checked-in copy.
language = "C"
pragma_once = true
include_guard = "METADATA_FFI_H"
autogen_warning = "/* Generated by cbindgen — do not edit. Regenerate via the Gradle cbindgen task. */"
tab_width = 4
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false
