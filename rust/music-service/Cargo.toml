[package]
name = "music-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum-core = { version = "0.5.5" }
axum = { version = "0.8.6", features = ["multipart"] }
axum-extra = { workspace = true }
reqwest = { version = "0.13.2", features = ["json","stream","multipart","form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.41.1", features = ["rt-multi-thread", "full"] }
tracing = {version = "0.1.41"}
tracing-subscriber = { version = "0.3.20", features = ["env-filter","json"] }
clap = { workspace = true }
clap-verbosity-flag = {version = "3.0.4", features = ["tracing"]}
base64 = "0.22.1"
uuid = { version = "1.18.1", features = ["serde","v7"] }
mime_guess = "2"
infer = "0.19.0"
id3 = { workspace = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
owo-colors = {version = "4.3.0"}
tower-http = { version = "0.6.6", features = ["cors"] }
qwen-asr = {git = "https://github.com/huanglizhuo/QwenASR"}
serde_qs = {version = "0.15.0"}
serde_path_to_error ={version = "=0.1.20"}
url = {version = "2.5.8"}
utoipa = { workspace = true }
matrix-sdk = { workspace = true }
matrix-client = { path = "../matrix-service/client" }
mysql_async = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
#tower = {version =  "0.5.3" }
#url = { version = "2.5.7" }
#serde_path_to_error ={version = "=0.1.20"}
